services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cp-finder-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpfinder_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cpfinder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpfinder}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
